
name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "hacs.json"
  # Версия подставляется в разметку при сборке, поэтому релиз меняет
  # опубликованный сайт, не трогая его исходники. Ловить это push-ом по
  # `manifest.json` нельзя: файл правит `EndBug/add-and-commit` с дефолтным
  # `GITHUB_TOKEN`, а коммиты этого токена push-событий не порождают —
  # проверено на релизе 4.1.0, ноль запусков. Поэтому цепляемся за workflow
  # релиза, который к тому моменту уже поднял версию в манифесте.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Неудачный релиз не публикует сайт с полусобранной версией.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
