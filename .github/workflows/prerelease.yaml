# ВНИМАНИЕ: значение `name` ниже является контрактом — prerelease-publish.yaml
# подписывается на этот workflow по имени через `workflow_run.workflows`.
# Переименование молча сломает публикацию пререлизов.
name: PR Pre-Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'custom_components/**'

# Для PR из форка GitHub всегда выдаёт read-only GITHUB_TOKEN — это не
# переопределяется ни настройкой репозитория, ни блоком permissions. Поэтому
# здесь релиз не создаётся: сборка только готовит артефакт, а публикацией
# занимается prerelease-publish.yaml (workflow_run в контексте base-репозитория).
permissions:
  contents: read

# Отменяем устаревшие сборки: иначе при двух быстрых push прогон A может
# финишировать позже B и опубликовать протухший zip поверх свежего.
concurrency:
  group: prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pre-release zip
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/elektronny_gorod"
          zip -r "${GITHUB_WORKSPACE}/elektronny_gorod.zip" ./

      # В артефакт намеренно не кладётся никаких метаданных о PR: этот job
      # выполняется на коде PR, поэтому всё его содержимое недоверенное.
      # Публикующий workflow определяет PR сам, из trusted-полей payload.
      - name: Upload pre-release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-prerelease
          path: elektronny_gorod.zip
          retention-days: 7
          if-no-files-found: error
