name: Python Tests

on:
  push:
    branches:
      - master
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements_test.txt'
      - 'pyrightconfig.json'
      - '.github/workflows/python-tests.yaml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements_test.txt'
      - 'pyrightconfig.json'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

# Версия для pyright-job: он обязан типизировать против того же ядра, что и
# current-плечо матрицы. Значение продублировано в `strategy.matrix` намеренно —
# GitHub не раскрывает контекст `env` внутри `strategy`, поэтому при подъёме
# версии правятся оба места.
env:
  PHC_CURRENT: '0.13.362'

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }}, HA ${{ matrix.ha-label }})
    runs-on: ubuntu-latest
    # Остальные workflow репозитория объявляют права явно; этот полагался на
    # умолчание, а оно в настройках репозитория стоит на запись.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - phc-version: '0.13.355'
            ha-label: '2026.8 (min)'
            python-version: '3.14'
          - phc-version: '0.13.362'
            ha-label: '2026.9 (current)'
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==${{ matrix.phc-version }}
          pip install -r requirements_test.txt

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --cov=custom_components.elektronny_gorod \
            --cov-report=term-missing \
            --cov-report=xml

      # Правило Silver `test-coverage` читается помодульно: «above 95% for all
      # integration modules». Агрегатного порога для него мало — модуль, упавший
      # до нуля, прячется за общей цифрой, и заявка в манифесте становится
      # ложной молча. ADR-0010 D-05 требует не заявлять уровень выше
      # подтверждённого гейтами, поэтому гейт проверяет ровно то, что заявлено.
      - name: Enforce the per-module coverage floor
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          FLOOR = 95.0  # «above 95%»: ровно 95.00 правилу не удовлетворяет
          MIN_MODULES = 40  # сейчас их 42; страховка от пустого отчёта
          PKG = "custom_components/elektronny_gorod"

          modules = [
              (c.get("filename"), float(c.get("line-rate")) * 100)
              for c in ET.parse("coverage.xml").getroot().iter("class")
          ]
          if len(modules) < MIN_MODULES:
              # Отчёт без модулей разобрался бы как «нарушений нет»: гейт,
              # заведённый против молчаливо ложной заявки, молча бы её и
              # пропустил.
              print(f"::error::в coverage.xml {len(modules)} модулей при "
                    f"ожидаемых хотя бы {MIN_MODULES} — отчёт неполон")
              sys.exit(1)

          low = sorted((rate, name) for name, rate in modules if rate <= FLOOR)
          for rate, name in low:
              # `filename` бывает и от корня репозитория (`--cov=пакет.через.точки`),
              # и от корня пакета — приставку добавляем только если её нет,
              # иначе аннотация укажет на несуществующий путь и не прицепится.
              # Перевод строки в имени раннер разобрал бы как вторую команду.
              path = (name if name.startswith(PKG) else f"{PKG}/{name}").replace("\n", " ")
              print(f"::error file={path}::"
                    f"покрытие {rate:.2f}% — правило требует выше {FLOOR}%")
          print(f"модулей: {len(modules)}, ниже порога: {len(low)}")
          sys.exit(1 if low else 0)
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-phc${{ matrix.phc-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  pyright:
    name: pyright (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements_test.txt

      # Типы HA берутся из ядра, поэтому нужна та же версия, что в current-job
      # (env.PHC_CURRENT — общий пин, чтобы job-ы не разъехались).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==${{ env.PHC_CURRENT }}
          pip install -r requirements_test.txt
          # Требование manifest: без него reportMissingImports даёт ложную
          # ошибку и приходится ослаблять правило (A-101).
          pip install 'firebase-messaging>=0.4.5'
          pip install pyright==1.1.411

      # Через pip, а не сторонний экшен: одной зависимостью с mutable-ref
      # меньше (см. A-98 follow-up).
      - name: Run pyright
        run: pyright
