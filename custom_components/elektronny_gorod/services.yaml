# Сервисы two-way audio (приём вызова домофона, register-on-ring, ADR-0012).
# См. docs/features/intercom-two-way-audio/. Без полей/target: действуют на
# текущий звонящий домофон (контроллер резолвит активный вызов).

answer:

hangup:

# Приглашение в дом — члена семьи или гостя (A-93): принявший становится абонентом адреса.
# Ответ — действующая ссылка, кто её открыл, тот и вошёл в дом. Поэтому только
# response и только администратору.
create_home_invite:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: elektronny_gorod
              model: Place

# Временный доступ к выбранным дверям со сроком (A-118, static-only).
# Отличается от приглашения в дом: разовый доступ к объектам, а не членство.
# Ответ-only и только администратору — выдаёт физический доступ.
create_temporary_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: elektronny_gorod
              model: Place
    ttl:
      required: true
      selector:
        number:
          min: 3600
          max: 86400
          unit_of_measurement: s
          mode: box
    access_control_ids:
      required: false
      selector:
        object:

list_temporary_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: elektronny_gorod
              model: Place

revoke_temporary_access:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: elektronny_gorod
              model: Place
    pass_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
